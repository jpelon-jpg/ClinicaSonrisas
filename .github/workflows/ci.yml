# Integración continua: en cada push compila backend y frontend, levanta MySQL 8,
# arranca la API y ejecuta la colección de Bruno contra ella.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend · compilar, pruebas y API con Bruno
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sonrisa_db
          MYSQL_USER: sonrisa_app
          MYSQL_PASSWORD: ci_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configuración de CI (sin secretos reales)
        working-directory: backend
        run: cp src/main/resources/application.properties.example src/main/resources/application.properties

      - name: Compilar y ejecutar pruebas unitarias
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Arrancar la API
        working-directory: backend
        run: |
          JWT=$(openssl rand -base64 64 | tr -d '\n')
          nohup java -jar target/sonrisa-api.jar \
            --spring.datasource.username=sonrisa_app \
            --spring.datasource.password=ci_password \
            --app.jwt.secret="$JWT" \
            --app.seed.enabled=true \
            --app.notificaciones.email.enabled=false \
            --app.notificaciones.sms.enabled=false \
            --app.notificaciones.whatsapp.enabled=false > api.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/auth/login \
              -H 'Content-Type: application/json' -d '{"email":"admin@sonrisa.com","password":"Admin#2026"}' || true)
            if [ "$code" = "200" ]; then echo "API lista (login admin = 200)"; exit 0; fi
            sleep 3
          done
          echo "La API no respondió"; cat api.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Colección de Bruno
        working-directory: bruno
        run: |
          npm install -g @usebruno/cli
          bru run --env Local

      - name: Log de la API
        if: always()
        working-directory: backend
        run: tail -n 200 api.log || true

  frontend:
    name: Frontend · compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar y compilar
        working-directory: frontend
        run: |
          npm install
          npm run build
