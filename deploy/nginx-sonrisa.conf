# /etc/nginx/sites-available/sonrisa   (Certbot agrega el bloque 443 y la redirección automáticamente)
server {
    listen 80;
    listen [::]:80;
    server_name TU-DOMINIO.com www.TU-DOMINIO.com;

    root /var/www/sonrisa;      # contenido de frontend/dist
    index index.html;

    # API -> Spring Boot
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React Router: cualquier ruta desconocida regresa index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # archivos con hash: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
